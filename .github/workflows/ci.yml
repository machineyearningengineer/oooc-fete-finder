name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm deadcode
      # Production builds in both modes: archive (as the Dockerfile ships it)
      # and live season, so a break in either fails CI.
      - name: Build (archive mode)
        run: pnpm build
        env:
          ARCHIVE_MODE: "true"
          NEXT_PUBLIC_ARCHIVE_MODE: "true"
          DATA_MODE: local
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          OOOC_FETE_LIVE_APP: "true"
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0123456789
      - name: Build (live season)
        run: pnpm build
        env:
          ARCHIVE_MODE: "false"
          NEXT_PUBLIC_ARCHIVE_MODE: "false"
          DATA_MODE: local
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          OOOC_FETE_LIVE_APP: "true"
          AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0123456789
