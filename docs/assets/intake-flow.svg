<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Collection to extraction to human review to publication, with fixed choices, structured values, and free text.</title><rect width="1000" height="560" fill="#f4eedf"/><rect x="14" y="14" width="972" height="532" fill="none" stroke="#b84a31" stroke-opacity=".4"/><text x="48" y="60" font-family="Degular" font-size="16" fill="#243d30" letter-spacing="2">THE DATA JOURNEY / BEFORE THE GUIDE</text><text x="48" y="126" font-family="Prata" font-size="44" fill="#243d30" >A suggestion needs a source.</text><rect x="48" y="190" width="199" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="66" y="225" font-family="Degular" font-size="25" fill="#243d30" >01  Collect</text><text x="66" y="255" font-family="Degular" font-size="17" fill="#243d30" >Flyers and listings</text><text x="66" y="279" font-family="Degular" font-size="17" fill="#243d30" >External + manual</text><rect x="283" y="190" width="199" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="301" y="225" font-family="Degular" font-size="25" fill="#243d30" >02  Extract</text><text x="301" y="255" font-family="Degular" font-size="17" fill="#243d30" >Gemini draft fields</text><text x="301" y="279" font-family="Degular" font-size="17" fill="#243d30" >Evidence + alternatives</text><rect x="518" y="190" width="199" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="536" y="225" font-family="Degular" font-size="25" fill="#243d30" >03  Review</text><text x="536" y="255" font-family="Degular" font-size="17" fill="#243d30" >Dates and duplicates</text><text x="536" y="279" font-family="Degular" font-size="17" fill="#243d30" >Venue ambiguity</text><rect x="753" y="190" width="199" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="771" y="225" font-family="Degular" font-size="25" fill="#243d30" >04  Publish</text><text x="771" y="255" font-family="Degular" font-size="17" fill="#243d30" >Reviewed event rows</text><text x="771" y="279" font-family="Degular" font-size="17" fill="#243d30" >Public finder</text><path d="M250 245L276 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M270 240L276 245L270 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M485 245L511 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M505 240L511 245L505 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M720 245L746 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M740 240L746 245L740 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M48 338L952 338" stroke="#243d30" fill="none" stroke-opacity=".25"/><text x="48" y="381" font-family="Degular" font-size="26" fill="#b84a31" >Fixed choices</text><text x="48" y="416" font-family="Degular" font-size="22" fill="#243d30" >Indoor / outdoor</text><text x="351" y="381" font-family="Degular" font-size="26" fill="#b84a31" >Structured values</text><text x="351" y="416" font-family="Degular" font-size="22" fill="#243d30" >Dates, times, prices</text><text x="682" y="381" font-family="Degular" font-size="26" fill="#b84a31" >Free text</text><text x="682" y="416" font-family="Degular" font-size="22" fill="#243d30" >Titles, venues, notes</text><text x="48" y="507" font-family="Degular" font-size="22" fill="#243d30" >Confidence helps prioritize review. It does not prove the extracted value is correct.</text></svg>