<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Fête Finder system boundaries: editor, event store, visitor, collection, archive, and browser recovery.</title><rect width="1000" height="560" fill="#f4eedf"/><rect x="14" y="14" width="972" height="532" fill="none" stroke="#b84a31" stroke-opacity=".4"/><text x="48" y="60" font-family="Degular" font-size="16" fill="#243d30" letter-spacing="2">THE SYSTEM / TWO SIDES OF THE GUIDE</text><text x="48" y="125" font-family="Prata" font-size="42" fill="#243d30" >Reviewed data. Useful decisions.</text><rect x="48" y="173" width="266" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="66" y="208" font-family="Degular" font-size="25" fill="#243d30" >Editor</text><text x="66" y="238" font-family="Degular" font-size="19" fill="#243d30" >Images → drafts → review</text><text x="66" y="262" font-family="Degular" font-size="19" fill="#243d30" >Authenticated sheet workflow</text><rect x="366" y="173" width="266" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="384" y="208" font-family="Degular" font-size="25" fill="#243d30" >Event store</text><text x="384" y="238" font-family="Degular" font-size="19" fill="#243d30" >Postgres → backup → CSV</text><text x="384" y="262" font-family="Degular" font-size="19" fill="#243d30" >Validate, cache, project</text><rect x="684" y="173" width="268" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="702" y="208" font-family="Degular" font-size="25" fill="#243d30" >Visitor</text><text x="702" y="238" font-family="Degular" font-size="19" fill="#243d30" >Discover → save → plan</text><text x="702" y="262" font-family="Degular" font-size="19" fill="#243d30" >List, map, stable links</text><path d="M317 229L357 229" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M351 224L357 229L351 234" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M636 229L675 229" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M669 224L675 229L669 234" fill="none" stroke="#b84a31" stroke-width="2"/><rect x="48" y="337" width="266" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="66" y="372" font-family="Degular" font-size="25" fill="#243d30" >External collection</text><text x="66" y="402" font-family="Degular" font-size="19" fill="#243d30" >Ticketing pages and posts</text><text x="66" y="426" font-family="Degular" font-size="19" fill="#243d30" >Separate from app runtime</text><rect x="366" y="337" width="266" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="384" y="372" font-family="Degular" font-size="25" fill="#243d30" >Archive mode</text><text x="384" y="402" font-family="Degular" font-size="19" fill="#243d30" >Bundled data; local routes</text><text x="384" y="426" font-family="Degular" font-size="19" fill="#243d30" >Live writes disabled</text><rect x="684" y="337" width="268" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="702" y="372" font-family="Degular" font-size="25" fill="#243d30" >Browser recovery</text><text x="702" y="402" font-family="Degular" font-size="19" fill="#243d30" >Saved event snapshots</text><text x="702" y="426" font-family="Degular" font-size="19" fill="#243d30" >After an online visit</text><path d="M181 287L181 334" stroke="#243d30" fill="none" stroke-dasharray="4 4" stroke-opacity=".5"/><path d="M499 287L499 334" stroke="#243d30" fill="none" stroke-dasharray="4 4" stroke-opacity=".5"/><path d="M818 287L818 334" stroke="#243d30" fill="none" stroke-dasharray="4 4" stroke-opacity=".5"/><text x="48" y="508" font-family="Degular" font-size="21" fill="#243d30" >Boundaries, not deployment topology. The holding page is a separate seasonal option.</text></svg>