<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670"><title>Public event request and authenticated image extraction, including their responses. Timing is illustrative.</title><rect width="1000" height="670" fill="#f4eedf"/><rect x="14" y="14" width="972" height="642" fill="none" stroke="#b84a31" stroke-opacity=".4"/><text x="48" y="60" font-family="Degular" font-size="16" fill="#243d30" letter-spacing="2">FÊTE FINDER / REQUEST FLOW</text><text x="48" y="124" font-family="Prata" font-size="42" fill="#243d30" >Read an event. Process a flyer.</text><text x="48" y="165" font-family="Degular" font-size="15" fill="#b84a31" letter-spacing="1.5">PUBLIC EVENT REQUEST</text><rect x="48" y="188" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="66" y="223" font-family="Degular" font-size="25" fill="#243d30" >Browser</text><text x="66" y="253" font-family="Degular" font-size="17" fill="#243d30" >GET event by key</text><text x="66" y="277" font-family="Degular" font-size="17" fill="#243d30" >Open details</text><rect x="48" y="415" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="66" y="450" font-family="Degular" font-size="25" fill="#243d30" >Editor</text><text x="66" y="480" font-family="Degular" font-size="17" fill="#243d30" >Upload 1–6 images</text><text x="66" y="504" font-family="Degular" font-size="17" fill="#243d30" >PNG / JPEG / WebP</text><path d="M241 245L277 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M271 240L277 245L271 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M241 472L277 472" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M271 467L277 472L271 477" fill="none" stroke="#b84a31" stroke-width="2"/><rect x="286" y="188" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="304" y="223" font-family="Degular" font-size="25" fill="#243d30" >Events API</text><text x="304" y="253" font-family="Degular" font-size="17" fill="#243d30" >Resolve eventKey</text><text x="304" y="277" font-family="Degular" font-size="17" fill="#243d30" >200 or 404</text><rect x="286" y="415" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="304" y="450" font-family="Degular" font-size="25" fill="#243d30" >OCR API</text><text x="304" y="480" font-family="Degular" font-size="17" fill="#243d30" >Auth + origin checks</text><text x="304" y="504" font-family="Degular" font-size="17" fill="#243d30" >Validate upload limits</text><path d="M479 245L515 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M509 240L515 245L509 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M479 472L515 472" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M509 467L515 472L509 477" fill="none" stroke="#b84a31" stroke-width="2"/><rect x="524" y="188" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="542" y="223" font-family="Degular" font-size="25" fill="#243d30" >Runtime</text><text x="542" y="253" font-family="Degular" font-size="17" fill="#243d30" >Cached event data</text><text x="542" y="277" font-family="Degular" font-size="17" fill="#243d30" >Assemble + validate</text><rect x="524" y="415" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="542" y="450" font-family="Degular" font-size="25" fill="#243d30" >Extraction</text><text x="542" y="480" font-family="Degular" font-size="17" fill="#243d30" >Gemini → normalize</text><text x="542" y="504" font-family="Degular" font-size="17" fill="#243d30" >Source + alternatives</text><path d="M717 245L753 245" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M747 240L753 245L747 250" fill="none" stroke="#b84a31" stroke-width="2"/><path d="M717 472L753 472" stroke="#b84a31" fill="none" stroke-width="2"/><path d="M747 467L753 472L747 477" fill="none" stroke="#b84a31" stroke-width="2"/><rect x="762" y="188" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="780" y="223" font-family="Degular" font-size="25" fill="#243d30" >Data sources</text><text x="780" y="253" font-family="Degular" font-size="17" fill="#243d30" >Store / backup / CSV</text><text x="780" y="277" font-family="Degular" font-size="17" fill="#243d30" >Archive: CSV only</text><rect x="762" y="415" width="190" height="112" fill="#faf6ec" stroke="#243d30" stroke-opacity=".3"/><text x="780" y="450" font-family="Degular" font-size="25" fill="#243d30" >Review draft</text><text x="780" y="480" font-family="Degular" font-size="17" fill="#243d30" >Fields and warnings</text><text x="780" y="504" font-family="Degular" font-size="17" fill="#243d30" >Editor decides to save</text><path d="M857 300V326H143V300" fill="none" stroke="#243d30" stroke-opacity=".35"/><text x="373" y="351" font-family="Degular" font-size="19" fill="#243d30" >Event JSON returns to the browser</text><path d="M48 372L952 372" stroke="#243d30" fill="none" stroke-opacity=".25"/><text x="48" y="396" font-family="Degular" font-size="15" fill="#b84a31" letter-spacing="1.5">MEDIA PROCESSING / AUTHENTICATED REQUEST</text><path d="M857 527V553H143V527" fill="none" stroke="#243d30" stroke-opacity=".35"/><text x="310" y="578" font-family="Degular" font-size="19" fill="#243d30" >Draft results return; extraction does not publish</text><path d="M48 602L952 602" stroke="#243d30" fill="none" stroke-opacity=".25"/><text x="48" y="636" font-family="Degular" font-size="19" fill="#243d30" >OCR runs within the request. Separate images run sequentially; a combined batch uses one call.</text></svg>