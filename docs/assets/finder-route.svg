<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><title>Fête Finder: discover, compare, and plan. Illustrative route, not a geographic map.</title><rect width="1000" height="560" fill="#f4eedf"/><rect x="14" y="14" width="972" height="532" fill="none" stroke="#b84a31" stroke-opacity=".4"/><text x="48" y="60" font-family="Degular" font-size="16" fill="#243d30" letter-spacing="2">OUT OF OFFICE COLLECTIVE  /  FÊTE FINDER</text><path d="M48 84L952 84" stroke="#243d30" fill="none" stroke-opacity=".25"/><text x="48" y="182" font-family="Prata" font-size="64" fill="#243d30" >Paris, at</text><text x="48" y="267" font-family="Prata" font-size="64" fill="#243d30" >your pace.</text><text x="50" y="326" font-family="Degular" font-size="24" fill="#243d30" >A little music. A few good detours.</text><text x="50" y="360" font-family="Degular" font-size="24" fill="#243d30" >One guide to make the night yours.</text><g opacity=".12" stroke="#243d30" fill="none"><path d="M520 124L470 431"/><path d="M518 146L950 123"/><path d="M578 124L534 431"/><path d="M518 182L950 164"/><path d="M636 124L598 431"/><path d="M518 218L950 205"/><path d="M694 124L662 431"/><path d="M518 254L950 246"/><path d="M752 124L726 431"/><path d="M518 290L950 287"/><path d="M810 124L790 431"/><path d="M518 326L950 328"/><path d="M868 124L854 431"/><path d="M518 362L950 369"/><path d="M926 124L918 431"/><path d="M518 398L950 410"/></g><path d="M490 398C620 263 689 464 780 365S886 213 968 247" stroke="#243d30" stroke-opacity=".13" stroke-width="22" fill="none"/><text x="861" y="420" font-family="Degular" font-size="13" fill="#243d30" letter-spacing="1.5">PARIS / STUDY</text><path d="M586 365L714 222L897 310" fill="none" stroke="#b84a31" stroke-width="2" stroke-dasharray="4 7" stroke-opacity=".35"/><path d="M586 365L714 222L897 310" fill="none" stroke="#b84a31" stroke-width="3" stroke-dasharray="396 396"/><g opacity="1"><circle cx="586" cy="365" r="16" fill="#f4eedf" stroke="#b84a31" stroke-width="2"/><text x="586" y="371" font-family="Degular" font-size="18" fill="#b84a31" text-anchor="middle">1</text><text x="570" y="332" font-family="Degular" font-size="20" fill="#243d30" >18:00</text><text x="570" y="410" font-family="Degular" font-size="17" fill="#243d30" >Start outside</text></g><g opacity="1"><circle cx="714" cy="222" r="16" fill="#f4eedf" stroke="#b84a31" stroke-width="2"/><text x="714" y="228" font-family="Degular" font-size="18" fill="#b84a31" text-anchor="middle">2</text><text x="698" y="189" font-family="Degular" font-size="20" fill="#243d30" >20:00</text><text x="698" y="267" font-family="Degular" font-size="17" fill="#243d30" >Find your sound</text></g><g opacity="1"><circle cx="897" cy="310" r="16" fill="#f4eedf" stroke="#b84a31" stroke-width="2"/><text x="897" y="316" font-family="Degular" font-size="18" fill="#b84a31" text-anchor="middle">3</text><text x="881" y="277" font-family="Degular" font-size="20" fill="#243d30" >23:00</text><text x="952" y="355" font-family="Degular" font-size="17" fill="#243d30" text-anchor="end">Stay for one more</text></g><path d="M48 464L952 464" stroke="#243d30" fill="none" stroke-opacity=".25"/><text x="48" y="513" font-family="Degular" font-size="22" fill="#243d30" >01  Find your sound</text><text x="353" y="513" font-family="Degular" font-size="22" fill="#243d30" >02  Compare the places</text><text x="658" y="513" font-family="Degular" font-size="22" fill="#b84a31" >03  Make it your route</text><path d="M658 531L872 531" stroke="#b84a31" fill="none" stroke-width="2"/></svg>